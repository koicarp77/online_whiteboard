<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>在线协作白板</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ==================== 登录视图 ==================== -->
  <div id="view-login" class="view" style="display:block;">
    <div class="login-wrapper">
      <div class="card login-card">
        <div class="logo">🎨</div>
        <h1 style="text-align:center;">在线协作白板</h1>
        <p class="slogan">实时协作绘图，团队沟通更高效</p>

        <form id="login-form">
          <div class="form-group">
            <label for="login-username">用户名</label>
            <input type="text" id="login-username" class="form-control"
                   placeholder="输入用户名" autocomplete="username" required />
          </div>
          <div class="form-group">
            <label for="login-password">密码</label>
            <input type="password" id="login-password" class="form-control"
                   placeholder="输入密码" autocomplete="current-password" required />
          </div>
          <p id="login-msg" class="msg"></p>
          <button type="submit" class="btn btn-primary btn-block">登 录</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ==================== 房间列表视图 ==================== -->
  <div id="view-rooms" class="view">
    <div class="container">

      <div class="header">
        <div>
          <h1>🎨 在线协作白板</h1>
          <span class="subtitle">选择一个房间开始协作</span>
        </div>
        <button id="btn-logout" class="btn btn-outline btn-sm">退出登录</button>
      </div>

      <!-- 创建房间 -->
      <div class="card">
        <h2>➕ 创建新房间</h2>
        <form id="room-form">
          <div class="form-inline" style="align-items:flex-end;flex-wrap:wrap;">
            <div class="form-group" style="flex:2;min-width:160px;">
              <label for="room-name">房间名称 *</label>
              <input type="text" id="room-name" class="form-control"
                     placeholder="例如：Sprint 评审" required />
            </div>
            <div class="form-group" style="flex:2;min-width:160px;">
              <label for="room-desc">描述</label>
              <input type="text" id="room-desc" class="form-control"
                     placeholder="房间用途（可选）" />
            </div>
            <div class="form-group" style="flex:1;min-width:100px;">
              <label for="room-max-users">人数上限</label>
              <input type="number" id="room-max-users" class="form-control"
                     value="100" min="1" max="100" />
            </div>
            <div class="form-group">
              <button type="submit" class="btn btn-primary">创建房间</button>
            </div>
          </div>
          <p id="room-msg" class="msg"></p>
        </form>
      </div>

      <!-- 房间列表 -->
      <div class="card">
        <h2>📋 活跃房间</h2>
        <div style="overflow-x:auto;">
          <table class="room-table">
            <thead>
              <tr>
                <th>房间 ID</th>
                <th>名称</th>
                <th>描述</th>
                <th>房主</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="room-list">
              <!-- JS 动态填充 -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <!-- ==================== 白板视图 ==================== -->
  <div id="view-whiteboard" class="view">
    <div class="whiteboard-layout">

      <!-- 工具栏 -->
      <div class="wb-toolbar">
        <!-- 绘制工具 -->
        <div class="tool-group">
          <button id="btn-pen" class="tool-btn active" title="画笔">✏️</button>
          <button id="btn-eraser" class="tool-btn" title="橡皮擦">🧹</button>
        </div>

        <span class="divider"></span>

        <!-- 颜色 -->
        <input type="color" id="color-picker" value="#000000" title="颜色选择" />

        <!-- 线宽 -->
        <input type="range" id="line-width" min="1" max="20" value="3" title="线条粗细" />

        <!-- 清空 -->
        <span class="divider"></span>
        <button id="btn-clear" class="btn btn-outline btn-sm" title="清空画布">🗑 清空</button>

        <!-- 房间信息 -->
        <div class="room-info">
          <span>房间：<strong id="wb-room-name">-</strong></span>
          <span>| 房主：<strong id="wb-room-owner">-</strong></span>
          <span>| <span id="wb-room-users">-</span></span>
        </div>

        <!-- 离开 -->
        <button id="btn-leave-room" class="btn btn-danger btn-sm">🚪 离开房间</button>
      </div>

      <!-- 画布 -->
      <div id="wb-container" class="wb-container"></div>

    </div>
  </div>

  <!-- 脚本：type="module" 以支持 ES Module -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
