volumes:
  mysql-data:
  redis-data:
  cpp-build-cache:

services:
  mysql:
    image: mysql:8.0
    container_name: proj-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: proj_db
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: proj-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass "123456"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping", "-a", "123456"]
      interval: 3s
      timeout: 2s
      retries: 5

  cpp-server:
    build:
      context: ./c++
      dockerfile: Dockerfile
    container_name: proj-cpp-server
    ports:
      - "8080:8080"
    volumes:
      - ./c++:/app                # 挂载源码，配合 watch.py 热编译
      - cpp-build-cache:/app/build # 编译产物放缓存卷，避免重复编译
    command: ["python3", "/app/watch.py"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: 123456
      JWT_SECRET: "online-whiteboard-secret"
    restart: always
    healthcheck:
      # alpine 镜像无 nc，改用 python3 探测端口
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('localhost', 8080), 1)\""]
      interval: 5s
      timeout: 3s
      retries: 5

  go-server:
    build:
      context: ./go
      target: dev
    container_name: proj-go-server
    ports:
      - "9090:9090"
    volumes:
      - ./go:/app
    command: ["air", "-c", ".air.toml"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: 123456
      MYSQL_DATABASE: proj_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: 123456
      JWT_SECRET: "online-whiteboard-secret"
      CPP_WS_HOST: "cpp-server"
      CPP_WS_PORT: "8080"
    restart: always
